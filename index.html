<!doctype html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Cuts</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<div class="hero"><b>✂️ AI Cuts</b><h1>Transforme vídeos longos em cortes</h1><p>Envie um vídeo para gerar cortes automaticamente.</p></div>
<section>
<label>Vídeo (MP4, MOV, WebM etc.)</label>
<input id="video" type="file" accept="video/*">
<p class="hint">Para o teste, recomendamos enviar o arquivo diretamente. O download do YouTube pode ser bloqueado pelo próprio YouTube.</p>
<label>Quantidade</label>
<select id="amount"><option>5</option><option selected>10</option><option>30</option></select>
<button id="generate">GERAR CORTES</button>
<div id="status"></div><div id="results"></div>
</section></main><script src="script.js"></script></body></html>
